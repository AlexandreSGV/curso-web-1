<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Calculadora com POST</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
<main>
  <h1>Calculadora com POST</h1>
  <p>Informe dois valores. O navegador envia os dados no corpo da mensagem HTTP.</p>
  <form action="calcular.php" method="post">
    <label for="a">Primeiro valor</label>
    <input type="number" id="a" name="a" step="any" required>

    <label for="b">Segundo valor</label>
    <input type="number" id="b" name="b" step="any" required>

    <button type="submit">Somar</button>
  </form>
</main>
</body>
</html>
